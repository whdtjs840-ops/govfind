services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: govfind
      POSTGRES_PASSWORD: govfind
      POSTGRES_DB: govfind
    ports:
      - "5432:5432"
    volumes:
      - govfind-postgres:/var/lib/postgresql/data

  meilisearch:
    image: getmeili/meilisearch:v1.9
    environment:
      MEILI_MASTER_KEY: dev_master_key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - govfind-meili:/meili_data

volumes:
  govfind-postgres:
  govfind-meili:
